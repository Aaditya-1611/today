<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipcart</title>
     <link rel="stylesheet" href="card.css">

</head>
<body>
    <div class="navbar">
    <div class="logo">Flipkart</div>
    <div class="search-box">
      <input type="text" placeholder="Search for products, brands and more">
    </div>
    <button class="login-btn">Login</button>
  </div>
 
  <div class="product">
 
    <div class="product-image">
      <img src="tanishk1.jpg" alt="Wireless Headphones">
    </div>
 
    <div class="product-info">
      <h2>Royal Blue Sapphire Diamond Necklace Set for Wedding | Luxury Bridal Jewelry Set</h2>
 
      <span class="rating">4.3 ★</span>
      <span>  1000+ Ratings</span>
 
      <div class="price">
        ₹1,499
        <span class="old-price">₹3,990</span>
        <span class="discount">62% off</span>
      </div>
 
      <p class="stock">Availability: In Stock</p>
 
      <button class="btn cart-btn">ADD TO CART</button>
      <button class="btn buy-btn">BUY NOW</button>
    </div>
 
  </div>
 
  <div class="reviews">
    <h3>Customer Reviews</h3>
 
    <div class="review">
      <h4>Rani Pasi</h4>
      <span class="rating">5 ★</span>
      <p>Great design . Value for money!</p>
    </div>
 
    <div class="review">
      <h4>sakshi</h4>
      <span class="rating">4 ★</span>
      <p>Comfortable to wear and looks preety .</p>
    </div>
  </div>
</body>
</html>
